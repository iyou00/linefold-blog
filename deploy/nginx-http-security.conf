# 放入 /www/server/nginx/conf/nginx.conf 的 http { } 内，然后重载 Nginx。
limit_req_zone $binary_remote_addr zone=field_notes_public:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=field_notes_admin:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=field_notes_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=field_notes_conn:10m;
