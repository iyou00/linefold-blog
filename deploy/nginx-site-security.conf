# 放入宝塔网站的 server { } 内。域名、证书和 HTTP 跳转继续由宝塔管理。
limit_req_status 429;
limit_conn_status 429;
client_max_body_size 2m;
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 30s;

location = /api/auth/login {
    limit_req zone=field_notes_login burst=3 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/admin/ {
    limit_req zone=field_notes_admin burst=20 nodelay;
    limit_conn field_notes_conn 10;
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    limit_req zone=field_notes_public burst=24 nodelay;
    limit_conn field_notes_conn 20;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_hide_header X-Powered-By;
}

location ~ /\.(?!well-known) {
    deny all;
}

location ~* \.(?:env|sqlite|db|log)$ {
    return 404;
}
